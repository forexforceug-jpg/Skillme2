<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox â€” Skillme2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="feed">

  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__menu" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="../index.html" class="topbar__logo">
        <img src="../assets/logo/logo.png" alt="Skillme2">
      </a>
    </div>
    <div class="topbar__center">
      <div class="topbar__search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" placeholder="Search messagesâ€¦" autocomplete="off">
      </div>
    </div>
    <div class="topbar__right">
      <button class="btn btn--navy" data-action="session">Sign In</button>
    </div>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-head">
        <div>
          <span class="eyebrow">Inbox</span>
          <h1 class="page-title">Messages</h1>
          <p class="page-desc">Your conversations with mentors and students.</p>
        </div>
        <button class="btn btn--navy">New Message</button>
      </div>

      <div class="inbox-layout">
        <div class="inbox-list" id="inbox-list"></div>
        <div class="inbox-thread" id="inbox-thread">
          <div class="inbox-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <path d="m22 6-10 7L2 6"/>
            </svg>
            <p>Select a conversation to read.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/sidebar-shared.js"></script>
  <script src="../js/page-inbox.js"></script>
</body>
</html>
