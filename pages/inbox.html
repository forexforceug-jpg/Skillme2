<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox — Skillme2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/inbox.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="feed">

  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__menu" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="../index.html" class="topbar__logo">
        <img src="../assets/logo/logo.png" alt="Skillme2">
        <span class="topbar__wordmark">Skillme2</span>
      </a>
    </div>
    <div class="topbar__center">
      <div class="topbar__search">
        <input type="text" id="feed-search" placeholder="Search lessons, teachers, or subjects…" autocomplete="off">
        <button class="topbar__search-icon" id="topbar-search-toggle" aria-label="Focus search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="topbar__right">
      <button class="topbar__search-trigger" id="topbar-search-trigger" aria-label="Open search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
      <div data-user-slot></div>
    </div>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main main--inbox">
      <div class="wa">

        <!-- LEFT: conversation list -->
        <aside class="wa__sidebar">
          <div class="wa__header">
            <h1 class="wa__title">Chats</h1>
            <button class="wa__icon-btn" aria-label="New chat">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
          </div>

          <div class="wa__search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="conv-search" placeholder="Search conversations" autocomplete="off">
          </div>

          <div class="wa__conv-list" id="conv-list">
            <div class="wa__empty"><p>Loading…</p></div>
          </div>
        </aside>

        <!-- RIGHT: thread -->
        <section class="wa__main" id="inbox-thread">
          <div class="wa__placeholder" id="empty-state">
            <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <path d="m22 6-10 7L2 6"/>
            </svg>
            <h2>Skillme2 Chats</h2>
            <p>Pick a conversation to view messages, or start a new one from a teacher's profile.</p>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/supabase-mutations.js"></script>
  <script src="../js/modals.js"></script>
  <script src="../js/topbar.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/inbox.js"></script>
</body>
</html>
