<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Lesson â€” Skillme2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/reviews.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/lesson-create.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="feed">

  <header class="topbar">
  <div class="topbar__left">
    <button class="topbar__menu" aria-label="Toggle sidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <a href="../index.html" class="topbar__logo">
      <img src="../assets/logo/logo.png" alt="Skillme2">
      <span class="topbar__wordmark">Skillme2</span>
    </a>
  </div>

  <div class="topbar__center">
    <div class="topbar__search">
      <input type="text" id="feed-search" placeholder="Search lessons, teachers, or subjectsâ€¦" autocomplete="off">
      <button class="topbar__search-icon" id="topbar-search-toggle" aria-label="Focus search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="topbar__right">
    <button class="topbar__search-trigger" id="topbar-search-trigger" aria-label="Open search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
    <div data-user-slot></div>
  </div>
</header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="wizard">
        <div class="wizard__head">
          <a href="my-classes.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
          </a>
          <h1 id="wiz-title">Create a lesson</h1>
          <p class="page-desc">Fill in the details. You can save as draft and publish later.</p>
        </div>

        <div class="wizard__steps">
          <div class="wizard__step is-active" data-step="1"><span>1</span> Basics</div>
          <div class="wizard__step" data-step="2"><span>2</span> Content</div>
          <div class="wizard__step" data-step="3"><span>3</span> Pricing</div>
          <div class="wizard__step" data-step="4"><span>4</span> Group</div>
          <div class="wizard__step" data-step="5"><span>5</span> Review</div>
        </div>

        <form id="lesson-form" class="wizard__form">

          <section class="wizard__panel is-active" data-panel="1">
            <label class="settings-block">
              <span class="settings-block__label">Lesson title</span>
              <input class="settings-input" type="text" name="title" required placeholder="e.g. Support & Resistance" maxlength="100">
            </label>
            <label class="settings-block">
              <span class="settings-block__label">Short description</span>
              <textarea class="settings-input" name="description" rows="2" maxlength="180" placeholder="One line that appears on the card"></textarea>
            </label>
            <div class="wizard__row">
              <label class="settings-block">
                <span class="settings-block__label">Category</span>
                <select class="settings-input" name="category_id" required id="cat-select"></select>
              </label>
              <label class="settings-block">
                <span class="settings-block__label">Level</span>
                <select class="settings-input" name="level">
                  <option value="all">All levels</option>
                  <option value="beginner">Beginner</option>
                  <option value="intermediate">Intermediate</option>
                  <option value="advanced">Advanced</option>
                </select>
              </label>
            </div>
            <div class="wizard__row">
              <label class="settings-block">
                <span class="settings-block__label">Language</span>
                <input class="settings-input" type="text" name="language" value="English">
              </label>
              <label class="settings-block">
                <span class="settings-block__label">Duration (minutes)</span>
                <select class="settings-input" name="duration_minutes" id="dur-select"></select>
              </label>
            </div>
            <label class="settings-block">
              <span class="settings-block__label">Cover image URL (optional)</span>
              <input class="settings-input" type="url" name="cover_url" placeholder="https://...">
            </label>
          </section>

          <section class="wizard__panel" data-panel="2">
            <label class="settings-block">
              <span class="settings-block__label">Full explanation</span>
              <textarea class="settings-input" name="body" rows="8" placeholder="What will you teach in this lesson?"></textarea>
            </label>
            <label class="settings-block">
              <span class="settings-block__label">What you'll learn (one per line)</span>
              <textarea class="settings-input" name="what_youll_learn" rows="4" placeholder="How to mark key levels&#10;Entry timing near support&#10;Stop placement for R:R > 2"></textarea>
            </label>
            <label class="settings-block">
              <span class="settings-block__label">What to bring (optional)</span>
              <textarea class="settings-input" name="preparation_notes" rows="2" placeholder="What should the student prepare?"></textarea>
            </label>
            <label class="settings-block">
              <span class="settings-block__label">Tags (comma separated)</span>
              <input class="settings-input" type="text" name="tags" placeholder="price action, support, resistance">
            </label>
          </section>

          <section class="wizard__panel" data-panel="3">
            <label class="settings-block">
              <span class="settings-block__label">Price per lesson (USD)</span>
              <input class="settings-input" type="number" name="price" min="0" step="0.01" value="30" required>
            </label>
            <p class="settings-hint">Enter 0 to offer this lesson for free.</p>
          </section>

          <section class="wizard__panel" data-panel="4">
            <label class="settings-block">
              <span class="settings-block__label">Format</span>
              <select class="settings-input" name="group_mode" id="group-mode-select">
                <option value="solo_only">1:1 only</option>
                <option value="group_allowed">Allow groups (students can join a scheduled session)</option>
                <option value="group_required">Group required (only runs if minimum seats fill)</option>
              </select>
            </label>
            <div id="group-fields" hidden>
              <div class="wizard__row">
                <label class="settings-block">
                  <span class="settings-block__label">Max seats</span>
                  <input class="settings-input" type="number" name="max_group_size" min="2" max="20" value="6">
                </label>
                <label class="settings-block">
                  <span class="settings-block__label">Min seats</span>
                  <input class="settings-input" type="number" name="min_group_size" min="1" max="20" value="2">
                </label>
              </div>
              <label class="settings-block">
                <span class="settings-block__label">Group discount curve</span>
                <p class="settings-hint">Price drops for students as more join. Percentages are per-student discounts off the base price.</p>
                <div id="discount-rows"></div>
                <button type="button" class="btn btn--ghost" id="add-discount-row" style="margin-top:0.5rem;">+ Add tier</button>
              </label>
            </div>
          </section>

          <section class="wizard__panel" data-panel="5">
            <h3 style="color:#fff;margin-bottom:1rem;">Preview</h3>
            <div id="preview-card" class="lesson-card" style="max-width:340px;"></div>
            <div class="wizard__final-actions">
              <button type="button" class="btn btn--ghost" id="save-draft">Save as draft</button>
              <button type="submit" class="btn btn--navy" id="publish-btn">Publish lesson</button>
            </div>
          </section>

          <div class="wizard__nav">
            <button type="button" class="btn btn--ghost" id="wiz-prev" disabled>Back</button>
            <button type="button" class="btn btn--navy" id="wiz-next">Next</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/supabase-mutations.js"></script>
  <script src="../js/likes.js"></script>
<script src="../js/reviews.js"></script>
  <script src="../js/modals.js"></script>
  <script src="../js/topbar.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/lesson-create.js"></script>
</body>
</html>
