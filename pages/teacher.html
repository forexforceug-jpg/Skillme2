<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher — Skillme2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/lesson-card.css">
  <link rel="stylesheet" href="../css/reviews.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="feed">

  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__menu" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="../index.html" class="topbar__logo">
        <img src="../assets/logo/logo.png" alt="Skillme2">
      </a>
    </div>
    <div class="topbar__center"></div>
    <div class="topbar__right" data-user-slot></div>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <button class="back-btn" onclick="history.length>1?history.back():location.href='../index.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </button>

      <section class="teacher-hero">
        <div class="teacher-hero__avatar">
          <img id="teacher-avatar" src="" alt="">
        </div>
        <div class="teacher-hero__info">
          <div class="teacher-hero__badges" id="teacher-badges"></div>
          <h1 id="teacher-name">Loading…</h1>
          <p id="teacher-bio" class="teacher-hero__bio"></p>

          <div class="teacher-hero__stats">
            <div>
              <strong id="teacher-likes">0</strong>
              <span>Likes</span>
            </div>
            <div>
              <strong id="teacher-taught">0</strong>
              <span>Lessons taught</span>
            </div>
            <div>
              <strong id="teacher-lessons-count">0</strong>
              <span>Lessons listed</span>
            </div>
          </div>

          <div class="teacher-hero__actions">
            <button class="like-btn like-btn--lg" id="teacher-like-btn" aria-label="Like teacher">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>
              </svg>
              <span class="like-btn__count">0</span>
            </button>

            <button class="btn btn--navy" id="teacher-message-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              Message
            </button>
          </div>
        </div>
      </section>

      <section class="page-section">
        <h2 class="table-title">Lessons by <span id="teacher-first-name">this teacher</span></h2>
        <div class="feed-grid" id="teacher-lessons"></div>
      </section>

      <section class="page-section">
        <h2 class="table-title">Reviews</h2>
        <div class="review-list" id="teacher-reviews"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/supabase-mutations.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/currency.js"></script>
  <script src="../js/likes.js"></script>
  <script src="../js/reviews.js"></script>
  <script src="../js/modals.js"></script>
  <script src="../js/topbar.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/lesson-modal.js"></script>
  <script src="../js/teacher.js"></script>
</body>
</html>
