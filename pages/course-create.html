<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Course — Skillme2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/lesson-card.css">
  <link rel="stylesheet" href="../css/lesson-create.css">
  <link rel="stylesheet" href="../css/course.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="feed">

  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__menu" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="../index.html" class="topbar__logo">
        <img src="../assets/logo/logo.png" alt="Skillme2">
        <span class="topbar__wordmark">Skillme2</span>
      </a>
    </div>
    <div class="topbar__center">
      <div class="topbar__search">
        <input type="text" id="feed-search" placeholder="Search lessons, teachers, or subjects…" autocomplete="off">
        <button class="topbar__search-icon" id="topbar-search-toggle" aria-label="Focus search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="topbar__right">
      <button class="topbar__search-trigger" id="topbar-search-trigger" aria-label="Open search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
      <div data-user-slot></div>
    </div>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="wizard">
        <div class="wizard__head">
          <a href="my-classes.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
          </a>
          <h1 id="wiz-title">Create a course</h1>
          <p class="page-desc">Group your lessons into an ordered learning path.</p>
        </div>

        <div class="wizard__steps">
          <div class="wizard__step is-active" data-step="1"><span>1</span> Basics</div>
          <div class="wizard__step" data-step="2"><span>2</span> Lessons</div>
          <div class="wizard__step" data-step="3"><span>3</span> Order</div>
          <div class="wizard__step" data-step="4"><span>4</span> Review</div>
        </div>

        <form id="course-form" class="wizard__form">

          <!-- STEP 1 -->
          <section class="wizard__panel is-active" data-panel="1">
            <div class="settings-block">
              <label class="settings-block__label" for="cc-title">Course title</label>
              <input class="settings-input" type="text" id="cc-title" name="title" required placeholder="e.g. Forex Fundamentals" maxlength="100">
            </div>

            <div class="settings-block">
              <label class="settings-block__label" for="cc-description">Description</label>
              <textarea class="settings-input" id="cc-description" name="description" rows="3" maxlength="400" placeholder="A short summary of what this course covers."></textarea>
            </div>

            <div class="settings-block">
              <label class="settings-block__label" for="cat-select">Category</label>
              <select class="settings-input" name="category_id" id="cat-select"></select>
            </div>

            <!-- Cover image upload -->
            <div class="settings-block">
              <label class="settings-block__label">Cover image</label>
              <div class="cover-upload">
                <div class="cover-upload__preview" id="cover-preview">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                  </svg>
                  <span>No image</span>
                </div>
                <div class="cover-upload__actions">
                  <button type="button" class="btn btn--ghost" id="cover-upload-btn">Upload image</button>
                  <button type="button" class="btn btn--ghost" id="cover-remove-btn">Remove</button>
                </div>
              </div>
              <input class="settings-input" type="url" name="cover_url" id="cover-url-input" placeholder="Or paste an image URL" style="margin-top:0.5rem;">
            </div>
          </section>

          <!-- STEP 2 -->
          <section class="wizard__panel" data-panel="2">
            <p class="page-desc" style="margin-bottom:1rem;">Select the lessons to include in this course.</p>
            <div id="lesson-picker" class="course-lesson-picker">
              <div class="dash-empty"><p>Loading your lessons…</p></div>
            </div>
          </section>

          <!-- STEP 3 -->
          <section class="wizard__panel" data-panel="3">
            <p class="page-desc" style="margin-bottom:1rem;">Drag to reorder. Lesson 1 will be shown first.</p>
            <div id="order-list" class="course-order-list">
              <div class="dash-empty"><p>Select lessons in the previous step.</p></div>
            </div>
          </section>

          <!-- STEP 4 -->
          <section class="wizard__panel" data-panel="4">
            <h3 class="wizard__preview-title">Preview</h3>
            <div id="course-preview" class="course-preview-card"></div>
            <div class="wizard__final-actions">
              <button type="button" class="btn btn--ghost" id="save-draft">Save as draft</button>
              <button type="submit" class="btn btn--navy" id="publish-btn">Publish course</button>
            </div>
          </section>

          <div class="wizard__nav">
            <button type="button" class="btn btn--ghost" id="wiz-prev" disabled>Back</button>
            <button type="button" class="btn btn--navy" id="wiz-next">Next</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/supabase-mutations.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/currency.js"></script>
  <script src="../js/likes.js"></script>
  <script src="../js/reviews.js"></script>
  <script src="../js/modals.js"></script>
  <script src="../js/topbar.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/course-create.js"></script>
</body>
</html>
