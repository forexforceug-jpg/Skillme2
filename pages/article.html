<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article â€” Skillme2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="feed">

  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__menu" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="../index.html" class="topbar__logo">
        <img src="../assets/logo/logo.png" alt="Skillme2">
      </a>
    </div>
    <div class="topbar__center"></div>
    <div class="topbar__right">
      <button class="btn btn--navy" data-action="session">Sign In</button>
    </div>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">

      <button class="back-btn" id="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </button>

      <div id="article-loading" class="skeleton-wrap">
        <div class="skeleton skeleton--hero"></div>
        <div class="skeleton skeleton--line"></div>
        <div class="skeleton skeleton--line"></div>
      </div>

      <article class="article" id="article-content" hidden>
        <div class="article__cover" id="article-cover-wrap">
          <img id="article-cover" src="" alt="">
        </div>

        <header class="article__head">
          <span class="eyebrow" id="article-category"></span>
          <h1 class="article__title" id="article-title"></h1>

          <div class="article__meta">
            <img class="article__author-avatar" id="article-author-avatar" src="" alt="">
            <div>
              <strong id="article-author"></strong>
              <span id="article-date"></span>
            </div>
          </div>
        </header>

        <div class="article__body" id="article-body"></div>

        <div class="article__actions">
          <button class="btn btn--ghost" id="article-print">Download as PDF</button>
        </div>
      </article>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/modals.js"></script>
  <script src="../js/sidebar-shared.js"></script>
  <script src="../js/page-article.js"></script>
</body>
</html>
