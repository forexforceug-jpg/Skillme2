<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet — Skillme2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/wallet.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="feed">

  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__menu" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="../index.html" class="topbar__logo">
        <img src="../assets/logo/logo.png" alt="Skillme2">
      </a>
    </div>
    <div class="topbar__center"></div>
    <div class="topbar__right" data-user-slot></div>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-head">
        <div>
          <span class="eyebrow">Wallet</span>
          <h1 class="page-title">Your balance</h1>
          <p class="page-desc">Top up to book lessons. Withdraw your earnings anytime.</p>
        </div>
      </div>

      <div class="wallet-balances">
        <div class="wallet-balance wallet-balance--primary">
          <span class="wallet-balance__label">Available</span>
          <span class="wallet-balance__value" id="wallet-available">$0.00</span>
          <span class="wallet-balance__hint">Ready to spend</span>
        </div>
        <div class="wallet-balance">
          <span class="wallet-balance__label">In Escrow</span>
          <span class="wallet-balance__value" id="wallet-escrow">$0.00</span>
          <span class="wallet-balance__hint">Held for upcoming lessons</span>
        </div>
        <div class="wallet-balance">
          <span class="wallet-balance__label">Earned</span>
          <span class="wallet-balance__value" id="wallet-earned">$0.00</span>
          <span class="wallet-balance__hint">Lifetime teaching income</span>
        </div>
      </div>

      <div class="wallet-actions">
        <button class="btn btn--navy" id="topup-btn">Add funds</button>
        <button class="btn btn--ghost" id="withdraw-btn">Withdraw</button>
      </div>

      <nav class="tabs" role="tablist" id="wallet-tabs">
        <button class="tabs__item is-active" data-tab="all">All</button>
        <button class="tabs__item" data-tab="topups">Top-ups</button>
        <button class="tabs__item" data-tab="bookings">Bookings</button>
        <button class="tabs__item" data-tab="earnings">Earnings</button>
        <button class="tabs__item" data-tab="withdrawals">Withdrawals</button>
      </nav>

      <div class="tab-panel is-active" data-panel="all">
        <div class="pay-list" id="tx-list"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/supabase-mutations.js"></script>
  <script src="../js/modals.js"></script>
  <script src="../js/topbar.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/wallet.js"></script>
</body>
</html>
