<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skillme2 — Learn Financial Markets from Real Traders</title>
  <meta name="description" content="Book live 1:1 lessons with verified trader-mentors, read strategy articles, and learn financial markets on your own terms.">
  <meta name="theme-color" content="#061019">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="feed">

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__menu" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="index.html" class="topbar__logo">
        <img src="assets/logo/logo.png" alt="Skillme2">
      </a>
    </div>

    <div class="topbar__center">
      <div class="topbar__search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="feed-search"
          placeholder="Search mentors, strategies, instruments, articles…"
          autocomplete="off"
        >
      </div>
    </div>

    <div class="topbar__right">
      <button class="btn btn--ghost" data-action="apply">Teach</button>
      <button class="btn btn--navy" data-action="session">Sign In</button>
    </div>
  </header>

  <!-- ============ LAYOUT ============ -->
  <div class="app" id="app">

    <aside class="sidebar" id="sidebar"></aside>
    <!-- ============ MAIN FEED ============ -->
    <main class="main">

      <div class="chips-wrap">
        <div class="chips" role="group" aria-label="Content filters">
          <button class="chip is-active" data-filter="all">All</button>
          <button class="chip" data-filter="mentors">Mentors</button>
          <button class="chip" data-filter="articles">Articles</button>
          <button class="chip" data-filter="strategies">Strategies</button>
          <button class="chip" data-filter="psychology">Psychology</button>
          <button class="chip" data-filter="crypto">Crypto</button>
          <button class="chip" data-filter="forex">Forex</button>
          <button class="chip" data-filter="indices">Indices</button>
          <button class="chip" data-filter="risk">Risk</button>
        </div>
      </div>

      <div class="feed-grid" id="feed-grid">
        <!-- Populated by js/feed.js -->
      </div>

    </main>

  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="footer footer--slim">
    <div class="container footer__inner">
      <div class="footer__brand">
        <img src="assets/logo/skillme2-logo.svg" alt="Skillme2">
        <p>Learn financial markets from real traders.</p>
      </div>

      <div class="footer__col">
        <h5>Platform</h5>
        <a href="index.html">Browse Mentors</a>
        <a href="pages/classes.html">Classes</a>
        <a href="pages/payments.html">Payments</a>
      </div>

      <div class="footer__col">
        <h5>Mentors</h5>
        <a href="#" data-action="apply">Apply to Teach</a>
        <a href="pages/terms.html">Guidelines</a>
        <a href="pages/payments.html">Payouts</a>
      </div>

      <div class="footer__col">
        <h5>Legal</h5>
        <a href="pages/terms.html">Terms</a>
        <a href="pages/privacy.html">Privacy</a>
        <a href="pages/terms.html">Refunds</a>
      </div>

      <div class="footer__col">
        <h5>Contact</h5>
        <a href="mailto:support@skillme2.com">support@skillme2.com</a>
        <p>© 2026 Skillme2.</p>
      </div>
    </div>
  </footer>

  <!-- ============ SCRIPTS ============ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/sidebar-shared.js"></script>
  <script>
    // Handle "My Mentors" collapsible group + load enrolled mentors on the homepage.
    (async function () {
      const group = document.querySelector('.sidebar__group[data-group="mentors"]');
      const toggle = group?.querySelector(".sidebar__group-toggle");
      if (group && toggle) {
        toggle.addEventListener("click", () => {
          const isOpen = group.dataset.open === "true";
          group.dataset.open = isOpen ? "false" : "true";
          toggle.setAttribute("aria-expanded", String(!isOpen));
        });
      }

      const list = document.getElementById("my-mentors-list");
      if (!list) return;

      const db = window.Skillme2DB;
      if (!db) return;

      const session = await window.Skillme2Auth.getSession();
      if (!session || session.role !== "student") {
        list.innerHTML = `<div class="sidebar__empty">Sign in as a student.</div>`;
        return;
      }

      const { data } = await db
        .from("bookings")
        .select(`mentor_id, mentors (id, name, photo)`)
        .eq("student_id", session.id);

      if (!data || !data.length) {
        list.innerHTML = `<div class="sidebar__empty">No mentors yet.</div>`;
        return;
      }

      const seen = new Set();
      const unique = data
        .map(b => b.mentors)
        .filter(m => m && !seen.has(m.id) && seen.add(m.id));

      if (!unique.length) {
        list.innerHTML = `<div class="sidebar__empty">No mentors yet.</div>`;
        return;
      }

      list.innerHTML = unique.map(m => `
        <a href="dashboard-student.html?mentor=${m.id}" class="sidebar__mentor-item">
          <img class="sidebar__mentor-avatar" src="${m.photo || `https://i.pravatar.cc/100?u=${m.id}`}" alt="">
          <span>${m.name}</span>
        </a>
      `).join("");
    })();

    // Sidebar toggle (desktop collapse, mobile slide-in)
    (function () {
      const menuBtn = document.querySelector(".topbar__menu");
      const app = document.getElementById("app");
      if (!menuBtn || !app) return;

      menuBtn.addEventListener("click", () => {
        const isMobile = window.matchMedia("(max-width: 1024px)").matches;
        if (isMobile) {
          app.classList.toggle("is-sidebar-open");
        } else {
          app.classList.toggle("is-sidebar-hidden");
        }
      });

      app.addEventListener("click", e => {
        if (e.target === app && app.classList.contains("is-sidebar-open")) {
          app.classList.remove("is-sidebar-open");
        }
      });
    })();
  </script>
</body>
</html>
